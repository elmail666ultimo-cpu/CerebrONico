<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Pintor</title>
<style>body{font:12px/1.5 ui-monospace,Consolas,monospace;background:#0b101c;color:#cbd5e1;padding:10px;margin:0}h4{margin:0 0 4px;color:#a78bfa}small{color:#64748b}input{background:#141b2b;color:#e2e8f0;border:1px solid #1f3a5f;border-radius:6px;padding:4px 8px;margin:0 6px 8px 0}button{background:#16233a;color:#c4b5fd;border:1px solid #4c3a78;padding:4px 10px;border-radius:6px;margin:0 6px 8px 0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#0a0f18;border:1px solid #1e293b;border-radius:8px;padding:8px;min-height:80px;margin:0}#sw{display:flex;gap:4px;margin:4px 0 8px}#sw i{width:28px;height:16px;border-radius:3px;display:inline-block;border:1px solid #1e293b}</style>
</head><body>
<h4>Pintor <small>cn.pintor · de un HEX a tokens CSS, calculado no inspirado</small></h4>
<input id="base" type="color" value="#3a6ea5"><input id="dest" placeholder="cn-palette.css o piel.cn" size="22">
<button id="go">Aplicar paleta</button><span id="sw"></span>
<pre id="out">Escribe cn-palette.css (:root con --c-*) o una piel .cn.</pre>
<script>
"use strict";
var seq=0,pending={},H={};
function call(m,p){return new Promise(function(res,rej){var id="r"+(++seq);pending[id]={res:res,rej:rej};parent.postMessage({cn:1,type:"request",id:id,method:m,params:p||{}},"*");});}
function out(s){document.getElementById("out").textContent=(typeof s==="string"?s:JSON.stringify(s,null,1))+"\n"+document.getElementById("out").textContent;}
window.addEventListener("message",function(ev){var m=ev.data||{};if(m.cn!==1)return;
if(m.type==="response"){var p=pending[m.id];if(!p)return;delete pending[m.id];if(m.ok)p.res(m.result);else p.rej(m.error||"el host rechazó la petición");}
if(m.type==="command"){var f=H[m.commandId];var done=function(r){var ok=!(r&&r.ok===false);parent.postMessage({cn:1,type:"commandResult",commandId:m.commandId,requestId:m.requestId,ok:ok,result:ok?(r&&r.result!==undefined?r.result:r):undefined,error:ok?undefined:((r&&r.error)||(r&&r.motivo)||"sin motivo declarado")},"*");};
if(!f){done({ok:false,error:"«"+m.commandId+"» no lo declara esta extensión"});return;}
Promise.resolve().then(function(){return f(typeof m.args==="string"?{base:m.args}:(m.args||{}));}).then(done,function(e){done({ok:false,error:String((e&&e.message)||e)});});}});
parent.postMessage({cn:1,type:"ready"},"*");
</script>
<script>
function hex2rgb(h){var m=/^#?([0-9a-f]{6})$/i.exec(String(h||"").trim());if(!m)return null;var n=parseInt(m[1],16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){var q=function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");};return"#"+q(r)+q(g)+q(b);}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2,s=d===0?0:d/(1-Math.abs(2*l-1)),h=0;
 if(d!==0){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return[h,s,l];}
function hsl2rgb(h,s,l){var c=(1-Math.abs(2*l-1))*s,hp=(((h%360)+360)%360)/60,x=c*(1-Math.abs((hp%2)-1)),r=0,g=0,b=0;
 if(hp<1){r=c;g=x;}else if(hp<2){r=x;g=c;}else if(hp<3){g=c;b=x;}else if(hp<4){g=x;b=c;}else if(hp<5){r=x;b=c;}else{r=c;b=x;}
 var m=l-c/2;return[(r+m)*255,(g+m)*255,(b+m)*255];}
H["pintor.aplicar"]=async function(a){
  var base=(typeof a.texto==="string"&&/^#?[0-9a-f]{6}/i.test(String(a.texto).trim())?String(a.texto).trim().split(" ")[0]:a.base)||document.getElementById("base").value;
  var rgb=hex2rgb(base); if(!rgb) return {ok:false,motivo:"«"+base+"» no es HEX de 6 dígitos."};
  var hsl=rgb2hsl(rgb[0],rgb[1],rgb[2]);
  var girar=function(d){var c=hsl2rgb(hsl[0]+d,hsl[1],hsl[2]);return rgb2hex(c[0],c[1],c[2]);};
  var tono=function(dl){var c=hsl2rgb(hsl[0],hsl[1],Math.max(0,Math.min(1,hsl[2]+dl)));return rgb2hex(c[0],c[1],c[2]);};
  var lum=function(hx){var v=hex2rgb(hx);var f=function(x){x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);};return 0.2126*f(v[0])+0.7152*f(v[1])+0.0722*f(v[2]);};
  var texto=lum(base)>0.4?"#0b101c":"#f1f5f9";
  var pal={base:rgb2hex(rgb[0],rgb[1],rgb[2]),complementaria:girar(180),triada1:girar(120),triada2:girar(240),analoga1:girar(-30),analoga2:girar(30),claro:tono(0.16),oscuro:tono(-0.16),texto:texto};
  var destino=String(a.destino||document.getElementById("dest").value||"cn-palette.css").trim();
  var esCn=/\.cn$/i.test(destino)||String(a.formato||"")==="cn";
  var lineas=[];
  if(esCn){lineas.push("# cn-skin 1 — generada por cn.pintor (no editar a mano: /pintar la re-calcula)");
    Object.keys(pal).forEach(function(k){lineas.push(k+" = "+pal[k]);});}
  else{lineas.push("/* cn-palette.css — derivada de "+pal.base+" por cn.pintor · armonías HSL reales */");
    lineas.push(":root {");
    Object.keys(pal).forEach(function(k){lineas.push("  --c-"+k+": "+pal[k]+";");});
    lineas.push("  --paso: 8px; --paso-2: 16px; --paso-3: 24px; --paso-4: 32px;", "}");
    lineas.push("body{background:var(--c-oscuro);color:var(--c-texto);font-family:system-ui,sans-serif}");
    lineas.push("a,button{color:var(--c-base)} a:hover{color:var(--c-complementaria)}");}
  if(destino.indexOf("..")>=0||/^[a-zA-Z]:|^[/\\]/.test(destino)) return {ok:false,motivo:"destino fuera del proyecto: usa ruta relativa."};
  await call("workspace.writeFile",{path:destino,content:lineas.join("\n")+"\n"});
  var enlazados=[];
  if(!esCn){ // la paleta debe VERSE en la preview: se inyecta en cada html que no la tenga (la piel .cn no se enlaza: es del IDE)
    var todos=(await call("workspace.getFiles"))||[];
    for(const f of todos){
      if(!/\.html?$/i.test(f.path)) continue;
      var c=String(f.content||"");
      if(c.indexOf(destino)>=0) continue;
      var nuevo=/<\/head>/i.test(c)
        ? c.replace(/<\/head>/i,"<link rel=\"stylesheet\" href=\""+destino+"\">\n</head>")
        : "<link rel=\"stylesheet\" href=\""+destino+"\">\n"+c;
      await call("workspace.writeFile",{path:f.path,content:nuevo});
      enlazados.push(f.path);
    }
  }
  document.getElementById("sw").innerHTML=Object.keys(pal).map(function(k){return "<i style=\"background:"+pal[k]+"\" title=\""+k+"\"></i>";}).join("");
  out(destino+" escrito + enlazado en "+(enlazados.length||0)+" html — "+Object.keys(pal).length+" colores de "+pal.base);
  return {destino:destino,paleta:pal,enlazados:enlazados,nota:esCn?"piel .cn: se aplica desde el Gestor de pieles del IDE, no se enlaza en la web":"recarga la preview: la paleta ya vive en el <head>"};
};
document.getElementById("go").onclick=function(){H["pintor.aplicar"]({base:document.getElementById("base").value,destino:document.getElementById("dest").value}).then(out);};
</script>
</body></html>
